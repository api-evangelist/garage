aid: garage
name: Garage
description: 'Garage (Garage Technologies, Inc.) is America''s online marketplace for buying and selling
  specialized vehicles and equipment — fire trucks, ambulances, and heavy-duty municipal apparatus. The
  platform helps fire departments, EMS services, municipalities, and dealers list surplus equipment and
  buy what they need in seconds, bundling AI-powered appraisals, virtual inspections, live auctions,
  payments, freight, financing, and warranties into one consumer marketplace. Garage raised $13.5M and
  is backed by Initialized Capital. It operates a public consumer web marketplace (shopgarage.com /
  withgarage.com); no public developer API program was found during enrichment.'
